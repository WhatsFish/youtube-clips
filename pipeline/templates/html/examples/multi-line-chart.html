<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_styles.css">
<style>
  /* Multi-line trend chart — lines draw left-to-right, end labels fade in last. */
  .title { margin-bottom: 20px; }
  .legend {
    display: flex; gap: 28px; margin-bottom: 18px;
    opacity: 0; transform: translateY(8px);
    transition: opacity var(--t-mid) ease, transform var(--t-mid) ease;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--text-soft); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .chart { position: relative; flex: 1; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .grid line { stroke: rgba(250,243,224,0.07); stroke-width: 1; }
  .axis text { fill: var(--text-faint); font-size: 14px; font-family: var(--font-stack); }
  .line {
    fill: none; stroke-width: 3;
    stroke-dasharray: 1200; stroke-dashoffset: 1200;
    transition: stroke-dashoffset 4500ms cubic-bezier(.2,.7,.3,1);
  }
  .label-end {
    font-size: 18px; font-weight: 700; font-family: var(--font-stack);
    opacity: 0; transition: opacity var(--t-mid) ease 4400ms;
  }
  .playing .legend { opacity: 1; transform: translateY(0); }
  .playing .line { stroke-dashoffset: 0; transition-delay: 400ms; }
  .playing .label-end { opacity: 1; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="kicker">大模型训练成本 · 美元 / 次</div>
  <div class="title">五年涨了 50 倍</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-secondary)"></div>GPT 系列</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-primary)"></div>Claude 系列</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent-tertiary)"></div>Gemini 系列</div>
  </div>
  <div class="chart">
    <svg viewBox="0 0 1120 460" preserveAspectRatio="none">
      <g class="grid">
        <line x1="60" x2="1120" y1="80" y2="80"/>
        <line x1="60" x2="1120" y1="180" y2="180"/>
        <line x1="60" x2="1120" y1="280" y2="280"/>
        <line x1="60" x2="1120" y1="380" y2="380"/>
      </g>
      <g class="axis">
        <text x="40" y="84" text-anchor="end">$200M</text>
        <text x="40" y="184" text-anchor="end">$150M</text>
        <text x="40" y="284" text-anchor="end">$100M</text>
        <text x="40" y="384" text-anchor="end">$50M</text>
        <text x="40" y="430" text-anchor="end">$0</text>
      </g>
      <g class="axis">
        <text x="60"   y="455" text-anchor="middle">2021</text>
        <text x="320"  y="455" text-anchor="middle">2022</text>
        <text x="580"  y="455" text-anchor="middle">2023</text>
        <text x="840"  y="455" text-anchor="middle">2024</text>
        <text x="1100" y="455" text-anchor="middle">2025</text>
      </g>
      <path class="line" stroke="#ffd166" d="M 60 422 L 320 396 L 580 256 L 840 130 L 1100 30"/>
      <path class="line" stroke="#ff8a4c" d="M 60 430 L 320 414 L 580 350 L 840 230 L 1100 110"/>
      <path class="line" stroke="#e76f51" d="M 60 430 L 320 430 L 580 380 L 840 250 L 1100 150"/>
      <text class="label-end" fill="#ffd166" x="1110" y="30" dy="-8">$200M</text>
      <text class="label-end" fill="#ff8a4c" x="1110" y="110" dy="-8">$160M</text>
      <text class="label-end" fill="#e76f51" x="1110" y="150" dy="-8">$140M</text>
    </svg>
  </div>
</div>
<script>
  window.startAnimation = function() { document.getElementById("stage").classList.add("playing"); };
</script>
</body>
</html>
